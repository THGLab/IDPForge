name: IDPForge
channels:
  - conda-forge
  - bioconda
  - nvidia
dependencies:
  # Build tools
  - python=3.10
  - pip
  - mkl
  - git

  # Scientific & MD libraries
  # The CUDA variant of openmm is forced via CONDA_OVERRIDE_CUDA in the .def file.
  - openmm
  - cuda-version=12.2
  - pdbfixer
  - biopython
  - numpy
  - pandas
  - numexpr>=2.8.4
  - scipy
  - mdtraj
  - pdb-tools

  # Bioinformatics tools
  - bioconda::hmmer
  - bioconda::hhsuite
  - bioconda::kalign2
  - bioconda::mmseqs2

  # ML & utility libraries
  - PyYAML
  - requests
  - tqdm
  - wandb
  - awscli
  - modelcif==0.7
  - ml-collections
  - aria2
  - einops
  - typing-extensions

  # Pip dependencies
  - pip:
      - pytorch-lightning
      - dm-tree==0.1.6
      - tensorboard
      - topoly
      - git+https://github.com/NVIDIA/dllogger.git@0478734ff7be75adde8d160e04872664d1c62e5f
